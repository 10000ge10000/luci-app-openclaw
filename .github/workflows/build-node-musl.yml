name: Build Node.js ARM64 musl

on:
  workflow_dispatch:
    inputs:
      build_v1:
        description: 'Build V1 (22.15.1) - Legacy compatibility'
        required: false
        default: true
        type: boolean
      build_v2:
        description: 'Build V2 (24.22.2) - Current stable version'
        required: false
        default: true
        type: boolean

jobs:
  # ── V1 构建: 使用 Alpine apk 模式 (22.15.1) ──
  build-v1:
    name: Build Node.js V1 (Legacy)
    if: ${{ inputs.build_v1 }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.build_info.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build Node.js V1 ARM64 musl (apk lts mode)
        run: |
          NODE_VER="22.15.1"
          mkdir -p dist
          echo "=== Building Node.js v${NODE_VER} ARM64 musl (apk lts mode) ==="
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/output" \
            -v "$PWD/scripts/build-node-musl.sh:/build-node-musl.sh:ro" \
            -e "NODE_VER=${NODE_VER}" \
            -e "BUILD_MODE=apk" \
            -e "PKG_TYPE=lts" \
            alpine:3.21 sh /build-node-musl.sh

      - name: Build info
        id: build_info
        run: |
          ARTIFACT_NAME=$(ls dist/*.tar.xz | head -1 | xargs basename)
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact: ${ARTIFACT_NAME}"

      - name: Verify tarball
        run: |
          echo "=== Output files ==="
          ls -lh dist/
          echo ""
          echo "=== Tarball contents (first 20 entries) ==="
          tar tJf dist/*.tar.xz | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-arm64-musl-v1
          path: |
            dist/*.tar.xz
            dist/*.sha256

  # ── V2 构建: 转发 unofficial-builds 官方社区 musl 构建 (24.22.2) ──
  build-v2:
    name: Build Node.js V2 (Current)
    if: ${{ inputs.build_v2 }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      artifact_name: ${{ steps.build_info.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build Node.js V2 ARM64 musl (unofficial-builds mode)
        run: |
          NODE_VER="24.22.2"
          mkdir -p dist
          echo "=== Fetching Node.js v${NODE_VER} ARM64 musl (unofficial-builds mode) ==="
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/output" \
            -v "$PWD/scripts/build-node-musl.sh:/build-node-musl.sh:ro" \
            -e "NODE_VER=${NODE_VER}" \
            -e "BUILD_MODE=unofficial" \
            alpine:3.21 sh /build-node-musl.sh

      - name: Build info
        id: build_info
        run: |
          ARTIFACT_NAME=$(ls dist/*.tar.xz | head -1 | xargs basename)
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Artifact: ${ARTIFACT_NAME}"

      - name: Verify tarball
        run: |
          echo "=== Output files ==="
          ls -lh dist/
          echo ""
          echo "=== Tarball contents (first 20 entries) ==="
          tar tJf dist/*.tar.xz | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-arm64-musl-v2
          path: |
            dist/*.tar.xz
            dist/*.sha256

  # ── 发布到 GitHub Release ──
  release:
    name: Create/Update Release
    needs: [build-v1, build-v2]
    if: always() && (needs.build-v1.result == 'success' || needs.build-v2.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download V1 artifact
        if: ${{ needs.build-v1.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: node-arm64-musl-v1
          path: dist/

      - name: Download V2 artifact
        if: ${{ needs.build-v2.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: node-arm64-musl-v2
          path: dist/

      - name: List all artifacts
        run: |
          echo "=== All artifacts ==="
          ls -lh dist/

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: node-bins
          name: "Node.js Prebuilt Binaries (musl)"
          files: |
            dist/*.tar.xz
            dist/*.sha256
          draft: false
          prerelease: false
          make_latest: false
          body: |
            预编译的 Node.js ARM64 musl 二进制文件，供 ARM64 OpenWrt/iStoreOS 设备使用。

            `openclaw-env` 优先从 [unofficial-builds](https://unofficial-builds.nodejs.org/) 下载 musl 构建，
            本 Release 只作为其不可达时的兜底镜像。

            ## 版本说明

            | 文件 | 版本 | 用途 |
            |------|------|------|
            | `node-v24.22.2-linux-arm64-musl.tar.xz` | V2 (当前) | OpenClaw 2026.9.36 / 2026.10.9 (要求 >=24.22.1 <25 \|\| >=26.12.1) |
            | `node-v22.23.2-linux-arm64-musl.tar.xz` | 旧 V2 | OpenClaw 2026.9.1 (插件 v2.2.x 基线) |
            | `node-v22.x.x-linux-arm64-musl.tar.xz` | V1 (旧版) | OpenClaw v2026.3.8 及更早版本 |

            ## 构建模式

            两种模式都不会把 glibc 二进制转换为 musl:
            - **V2**: 原样转发 unofficial-builds 的 `node-v24.22.2-linux-arm64-musl.tar.xz`，按上游 SHASUMS256.txt 校验，并在 ARM64 Alpine 容器内实际运行验证
            - **V1**: 使用 Alpine `nodejs` LTS 包 (v22.x)，兼容旧版 OpenClaw

            `openclaw-env setup` 会在 ARM64 musl 设备上自动从此处下载合适的版本。
