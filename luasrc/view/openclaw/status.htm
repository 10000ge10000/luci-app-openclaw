<%#
 luci-app-openclaw — 运行状态面板 (全面汉化 + 界面优化)
-%>

<style type="text/css">
#oc-status-panel {
	margin: 0 0 20px 0;
	padding: 0;
	border: 1px solid #e0e0e0;
	border-radius: 8px;
	background: #fff;
	overflow: hidden;
	box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
#oc-status-panel .panel-title {
	background: linear-gradient(135deg, #4a90d9, #357abd);
	color: #fff;
	padding: 10px 16px;
	font-size: 14px;
	font-weight: 600;
	letter-spacing: 0.5px;
}
#oc-status-panel .panel-body {
	padding: 0;
}
#oc-status-panel table {
	width: 100%;
	border-collapse: collapse;
}
#oc-status-panel td {
	padding: 8px 16px;
	border-bottom: 1px solid #f2f2f2;
	font-size: 13px;
	vertical-align: middle;
}
#oc-status-panel tr:last-child td {
	border-bottom: none;
}
#oc-status-panel td:first-child {
	width: 120px;
	color: #888;
	font-weight: 500;
	white-space: nowrap;
}
#oc-status-panel td:last-child {
	color: #333;
}
.oc-badge {
	display: inline-block;
	padding: 2px 12px;
	border-radius: 12px;
	font-size: 12px;
	font-weight: 600;
}
.oc-badge-running { background: #e6f7e9; color: #1a7f37; }
.oc-badge-stopped { background: #ffeef0; color: #cf222e; }
.oc-badge-starting { background: #fff8c5; color: #9a6700; }
.oc-badge-failed { background: #ffeef0; color: #cf222e; }
.oc-badge-disabled { background: #f0f0f0; color: #656d76; }
.oc-badge-unknown { background: #fff8c5; color: #9a6700; }
.oc-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.oc-dot-green { background: #1a7f37; }
.oc-dot-red { background: #cf222e; }
.oc-dot-gray { background: #999; }
</style>

<div id="oc-status-panel">
	<div class="panel-title" id="oc-panel-title">🦞 OpenClaw 服务状态</div>
	<div class="panel-body">
		<table>
			<tr><td>运行状态</td><td id="oc-st-status"><span class="oc-badge oc-badge-unknown">加载中...</span></td></tr>
			<tr><td>网关服务</td><td id="oc-st-gateway">-</td></tr>
			<tr><td>配置终端</td><td id="oc-st-pty">-</td></tr>
			<tr><td>活跃模型</td><td id="oc-st-model">-</td></tr>
			<tr><td>消息渠道</td><td id="oc-st-channels">-</td></tr>
			<tr><td>进程 PID</td><td id="oc-st-pid">-</td></tr>
			<tr><td>内存占用</td><td id="oc-st-mem">-</td></tr>
			<tr><td>运行时间</td><td id="oc-st-uptime">-</td></tr>
			<tr><td>Node.js</td><td id="oc-st-node">-</td></tr>
				<tr><td>OpenClaw</td><td id="oc-st-oc-ver">-</td></tr>
				<tr><td>版本提示</td><td id="oc-st-version-warning">-</td></tr>
			<tr><td>插件版本</td><td id="oc-st-plugin">-</td></tr>
			<tr><td>安装路径</td><td id="oc-st-path">-</td></tr>
			<tr><td>剩余空间</td><td id="oc-st-disk">-</td></tr>
		</table>
	</div>
</div>

<script type="text/javascript">
//<![CDATA[
(function() {
		var statusUrl = '<%=luci.dispatcher.build_url("admin", "services", "openclaw", "status_api")%>';
		function text(id, value) { var el=document.getElementById(id); if(el) el.textContent=String(value == null || value === '' ? '-' : value); }
		function dot(id, cls, value) {
			var el=document.getElementById(id); if(!el) return; el.textContent='';
			var span=document.createElement('span'); span.className='oc-dot '+cls; el.appendChild(span); el.appendChild(document.createTextNode(String(value)));
		}
		function badge(value, cls) { var el=document.getElementById('oc-st-status'); if(!el) return; el.textContent=''; var span=document.createElement('span'); span.className='oc-badge '+cls; span.textContent=value; el.appendChild(span); }
		function codeValue(id, value) { var el=document.getElementById(id); if(!el) return; el.textContent=''; if(value){ var code=document.createElement('code'); code.textContent=String(value); el.appendChild(code); } else el.textContent='-'; }
		function updateStatus() {
			if(document.visibilityState !== 'visible') return;
			(new XHR()).get(statusUrl, null, function(x) {
				try {
					var d = JSON.parse(x.responseText);
					if (d.enabled !== '1') badge('已禁用','oc-badge-disabled');
					else if (d.gateway_running) badge('运行中','oc-badge-running');
					else if (d.gateway_starting) badge('⏳ 正在启动...','oc-badge-starting');
					else if (d.gateway_failed) badge('启动失败','oc-badge-failed');
					else badge('已停止','oc-badge-stopped');
					if (d.gateway_running) dot('oc-st-gateway','oc-dot-green','监听中 :'+d.port);
					else if (d.gateway_starting) dot('oc-st-gateway','oc-dot-gray','初始化中，通常 20~40 秒；首次安装或负载较高时会更久...');
					else if (d.gateway_failed) dot('oc-st-gateway','oc-dot-red','启动失败，退出码 '+(d.gateway_exit_code || '-'));
					else dot('oc-st-gateway','oc-dot-red','未监听');
					if (d.pty_running) dot('oc-st-pty','oc-dot-green','监听中 :'+d.pty_port); else dot('oc-st-pty','oc-dot-gray','未监听');
					text('oc-st-pid',d.pid); text('oc-st-channels',d.channels || '未配置'); codeValue('oc-st-model',d.active_model);
					text('oc-st-mem',d.memory_kb > 0 ? (d.memory_kb/1024).toFixed(1)+' MB' : '-'); text('oc-st-uptime',d.uptime);
					text('oc-st-node',d.node_version || '未安装'); text('oc-st-oc-ver',d.oc_version ? 'v'+d.oc_version : '未安装'); text('oc-st-plugin',d.plugin_version ? 'v'+d.plugin_version : '-');
					codeValue('oc-st-path',d.install_path); text('oc-st-disk',d.disk_free ? d.disk_free+' 可用' : '-');
					text('oc-st-version-warning',d.version_warning || (d.version_compatible ? '已匹配适配版本' : '-'));
				} catch(e) { badge('查询失败','oc-badge-unknown'); }
			});
		}
		updateStatus();
		var timer=setInterval(function(){ if(document.visibilityState === 'visible') updateStatus(); }, 5000);
		document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') updateStatus(); });
})();
//]]>
</script>
